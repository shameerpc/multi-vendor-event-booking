# Netlify deployment config for the EventHub frontend (Vite + React Router).
#
# IMPORTANT: Before building on Netlify, set the environment variable
#   VITE_API_URL = https://eventhub-api.onrender.com/api
# in Netlify > Site settings > Environment variables (or use a build command
# override). Vite bakes VITE_* variables into the JS bundle at build time, so
# it must be present when `npm run build` runs.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA routing: netlify serves this app from "frontend". We only build the
# static SPA regardless of how Netlify detects the project root.

# Single Page Application fallback - every route (e.g. /login, /customer)
# returns index.html so React Router can handle it client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed static assets aggressively, never cache index.html.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"